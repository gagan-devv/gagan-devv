name: Update README stats

on:
  schedule:
    - cron: "0 18 * * *" # 23:30 IST nightly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate stats.svg and langs.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet assets/stats.svg assets/langs.svg; then
            echo "no changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/stats.svg assets/langs.svg
            git commit -m "chore: refresh README stats"
            git push
          fi
